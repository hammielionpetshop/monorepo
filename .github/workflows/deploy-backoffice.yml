name: Deploy Backoffice to Vercel (nonaktif)

# Deploy otomatis sudah pindah ke .github/workflows/deploy-vps.yml.
#
# Workflow ini sengaja belum dihapus: sampai DNS benar-benar drain ke VPS baru,
# Vercel adalah jalur rollback — kembalikan A record, jalankan workflow ini manual,
# dan produksi hidup lagi. Hapus berkas ini (beserta apps/backoffice/vercel.json)
# di PR tersendiri setelah cutover terbukti aman.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Versi dibaca dari `packageManager` di package.json — lihat catatan di ci.yml.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel environment
        working-directory: apps/backoffice
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        working-directory: apps/backoffice
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        working-directory: apps/backoffice
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

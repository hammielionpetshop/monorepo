name: Deploy staging HRIS

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/staging'
    name: Build staging ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backoffice
            target: runner
            app_name: backoffice
          - image: order-web
            target: runner
            app_name: order-web
          - image: hris
            target: runner
            app_name: hris
          - image: migrator
            target: migrator
            app_name: backoffice
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verifikasi palang staging
        if: matrix.image == 'migrator'
        run: |
          node --test infra/staging/check-env.test.mjs infra/staging/refresh-db.test.mjs
          python3 -m unittest discover -s infra/staging -p 'test_*.py'
          bash -n infra/staging/deploy.sh infra/staging/refresh-db.sh
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push staging
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/apps/Dockerfile
          target: ${{ matrix.target }}
          build-args: APP_NAME=${{ matrix.app_name }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:staging-${{ github.sha }}
          cache-from: type=gha,scope=staging-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=staging-${{ matrix.image }}

  deploy:
    if: github.ref == 'refs/heads/staging'
    name: Deploy staging di VPS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Kirim konfigurasi staging dan cron
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: infra/staging,infra/apps/cron
          target: /tmp/hammielion-staging-${{ github.sha }}
          strip_components: 1
          overwrite: true
      - name: Migrasi dan nyalakan staging
        uses: appleboy/ssh-action@v1
        env:
          TAG: staging-${{ github.sha }}
          REVISION: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TAG,REVISION,GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
            sudo -n --preserve-env=TAG,REVISION,GHCR_TOKEN,GHCR_USER bash <<'STAGING_DEPLOY'
            set -euo pipefail
            [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
            staging_source="/tmp/hammielion-staging-${REVISION}"
            install -d -m 700 /srv/hammielion-staging /srv/hammielion-staging/cron
            exec 9> /srv/hammielion-staging/.deploy.lock
            flock -n 9 || { echo 'Deploy/refresh staging lain masih berjalan.' >&2; exit 1; }
            cp -R "$staging_source/staging/." /srv/hammielion-staging/
            cp -R "$staging_source/apps/cron/." /srv/hammielion-staging/cron/
            bash /srv/hammielion-staging/deploy.sh
            STAGING_DEPLOY

# Deployment backoffice + order-web di VPS.
#
# Berkas ini disalin ke /srv/hammielion/ di VPS bersama Caddyfile, lalu:
#   docker compose pull && docker compose up -d
#
# Image dibangun GitHub Actions dan diambil dari GHCR — VPS tidak pernah
# membangun sendiri, jadi RAM-nya tidak perlu memikul build Next.

name: hammielion

services:
  # Postgres pindah ke sini dari VPS lama (2026-08-15). Sengaja TANPA `ports:` —
  # database hanya terjangkau dari jaringan compose, tidak pernah dari internet.
  # Itu yang menghapus kebutuhan sertifikat TLS, firewall per-IP, dan perpanjangan
  # sertifikat berkala: jalurnya tidak pernah meninggalkan mesin ini.
  postgres:
    image: postgres:14
    restart: unless-stopped
    env_file:
      - postgres.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Gateway WhatsApp untuk OTP portal pelanggan. Pindah ke sini dari VPS lama
  # (2026-08-15) — di sana port-nya sudah tidak terjangkau.
  #
  # Sengaja TANPA `ports:`. order-web memanggilnya lewat http://waha:3000 di jaringan
  # compose, jadi tidak ada alasan mengeksposnya: dashboard WAHA memberi akses penuh
  # ke WhatsApp toko, dan API key saja terlalu tipis untuk menghadap internet.
  # Untuk scan QR, tembus lewat terowongan SSH — lihat runbook.
  waha:
    image: devlikeapro/waha
    restart: unless-stopped
    env_file:
      - waha.env
    volumes:
      # Sesi WhatsApp. Kalau volume ini hilang, harus scan QR ulang.
      - waha_sessions:/app/.sessions
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN_BACKOFFICE: ${DOMAIN_BACKOFFICE:?wajib diisi di .env}
      DOMAIN_ORDER_WEB: ${DOMAIN_ORDER_WEB:?wajib diisi di .env}
      ACME_EMAIL: ${ACME_EMAIL:?wajib diisi di .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Sertifikat Let's Encrypt. Kalau volume ini hilang, Caddy menerbitkan ulang
      # dari nol dan gampang kena rate limit — jangan ikut dihapus saat bersih-bersih.
      - caddy_data:/data
      - caddy_config:/config
      # Berkas upload disajikan langsung oleh Caddy, bukan lewat Next: public/ hanya
      # melayani berkas yang sudah ada saat build.
      - uploads_data:/srv/uploads:ro
    # Sengaja depends_on biasa, bukan service_healthy: kalau DB sedang tidak
    # terjangkau, app jadi unhealthy — dan Caddy tetap harus hidup untuk
    # menyajikan halaman error, bukan ikut mati.
    depends_on:
      - backoffice
      - order-web

  backoffice:
    image: ghcr.io/${GHCR_OWNER:?wajib diisi di .env}/backoffice:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - backoffice.env
    environment:
      PORT: "3000"
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads_data:/data/uploads
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy

  order-web:
    image: ghcr.io/${GHCR_OWNER:?wajib diisi di .env}/order-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - order-web.env
    environment:
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  uploads_data:
  # Data produksi. Jangan pernah ikut terhapus saat bersih-bersih —
  # `docker compose down -v` akan menghapusnya.
  pgdata:
  # Sesi WhatsApp. Hilang = harus scan QR ulang dengan HP nomor toko.
  waha_sessions:

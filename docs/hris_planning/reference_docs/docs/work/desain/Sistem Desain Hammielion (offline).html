document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rgin:0;background:#F4F0EA;color:#2B241F;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}\n*{box-sizing:border-box}\na{color:#17706A}a:hover{color:#0F5E59}\nbutton{font-family:inherit}\ninput{font-family:inherit}\n@keyframes hmSpin{to{transform:rotate(360deg)}}\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums;max-width:1120px;margin:0 auto;padding:40px 24px 80px\">\n\n<header style=\"display:flex;flex-direction:column;gap:20px;padding-bottom:32px\">\n  <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n    <div style=\"width:40px;height:40px;border-radius:12px;background:#17706A;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px\">H<\u002Fdiv>\n    <div style=\"font-weight:800;font-size:18px;letter-spacing:-0.01em\">Hammielion HRIS<\u002Fdiv>\n    <div style=\"font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:#E3D9CC;color:#5C524A\">Sistem Desain · v1.0<\u002Fdiv>\n  <\u002Fdiv>\n  <h1 style=\"margin:0;font-size:44px;line-height:1.1;font-weight:800;letter-spacing:-0.02em;max-width:820px;text-wrap:pretty\">Satu bahasa tampilan untuk kasir, groomer, driver, kepala toko, dan kantor.<\u002Fh1>\n  <p style=\"margin:0;font-size:18px;line-height:1.6;color:#5C524A;max-width:760px;text-wrap:pretty\">Hangat seperti petshop, rapi seperti aplikasi kerja. Dirancang untuk handphone dengan sinyal lemah lebih dulu, lalu PC. Setiap komponen digambar dalam empat bingkai: terang dan gelap, PC dan handphone. Semua mengikuti aturan TAM-01 sampai TAM-24.<\u002Fp>\n  <nav style=\"display:flex;flex-wrap:wrap;gap:8px\">\n    <a href=\"#warna\" style=\"padding:10px 16px;border-radius:999px;background:#fff;border:1px solid #E3D9CC;text-decoration:none;font-weight:600;font-size:15px;color:#2B241F\">1. Warna<\u002Fa>\n    <a href=\"#huruf\" style=\"padding:10px 16px;border-radius:999px;background:#fff;border:1px solid #E3D9CC;text-decoration:none;font-weight:600;font-size:15px;color:#2B241F\">2. Huruf<\u002Fa>\n    <a href=\"#komponen\" style=\"padding:10px 16px;border-radius:999px;background:#fff;border:1px solid #E3D9CC;text-decoration:none;font-weight:600;font-size:15px;color:#2B241F\">3. Komponen<\u002Fa>\n    <a href=\"#coba\" style=\"padding:10px 16px;border-radius:999px;background:#17706A;border:1px solid #17706A;text-decoration:none;font-weight:700;font-size:15px;color:#fff\">4. Coba langsung<\u002Fa>\n    <a href=\"#tata-letak\" style=\"padding:10px 16px;border-radius:999px;background:#fff;border:1px solid #E3D9CC;text-decoration:none;font-weight:600;font-size:15px;color:#2B241F\">5. Tata letak<\u002Fa>\n  <\u002Fnav>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:8px\">\n    <div style=\"background:#fff;border:1px solid #E3D9CC;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px\"><div style=\"font-weight:700;font-size:15px\">Satu layar, satu tugas<\u002Fdiv><div style=\"font-size:14px;line-height:1.5;color:#5C524A\">Pekerjaan bertahap dipecah per langkah, selalu ada jalan keluar.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E3D9CC;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px\"><div style=\"font-weight:700;font-size:15px\">Baca dulu, baru tekan<\u002Fdiv><div style=\"font-size:14px;line-height:1.5;color:#5C524A\">Jendela penting terkunci 1 detik; urusan uang 3 detik.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E3D9CC;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px\"><div style=\"font-weight:700;font-size:15px\">Jari, bukan kursor<\u002Fdiv><div style=\"font-size:14px;line-height:1.5;color:#5C524A\">Tombol minimal 48 px tinggi, jarak 12 px, isi minimal 16 px.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- 1. WARNA -->\n<section id=\"warna\" style=\"padding:48px 0;border-top:1px solid #E3D9CC;display:flex;flex-direction:column;gap:24px;scroll-margin-top:16px\">\n  <div style=\"display:flex;flex-direction:column;gap:8px;max-width:760px\">\n    <div style=\"font-size:13px;font-weight:800;color:#17706A;letter-spacing:.06em\">1 · WARNA · TAM-11<\u002Fdiv>\n    <h2 style=\"margin:0;font-size:32px;line-height:1.2;font-weight:800;letter-spacing:-0.01em\">Warna<\u002Fh2>\n    <p style=\"margin:0;font-size:16px;line-height:1.6;color:#5C524A;text-wrap:pretty\">Warna utama <b>Toska<\u002Fb>: tenang, bersih, dan ramah hewan, tidak bentrok dengan merah bahaya atau kuning peringatan. Kehangatan datang dari latar krem dan tulisan cokelat tua, bukan abu-abu dingin. <b>Jingga<\u002Fb> hanya dipakai untuk tanda \"Baru\". Warna status selalu ditemani tanda bentuk (✓ ✕ ○ –) supaya tetap terbaca oleh yang buta warna.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"background:#fff;border:1px solid #E3D9CC;border-radius:16px;overflow:hidden\">\n    <div style=\"display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.6fr);gap:0;font-size:12px;font-weight:800;letter-spacing:.06em;color:#756A60;padding:12px 16px;border-bottom:1px solid #E3D9CC;background:#FAF7F2\">\n      <div>NAMA<\u002Fdiv><div>TERANG<\u002Fdiv><div>GELAP<\u002Fdiv><div>DIPAKAI UNTUK<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-for list=\"{{ tokens }}\" as=\"t\" hint-placeholder-count=\"14\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.6fr);gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid #F0E9DF\">\n        <div style=\"font-weight:700;font-size:15px\">{{ t.name }}<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;min-width:0\"><span style=\"{{ t.swL }}\"><\u002Fspan><code style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5C524A\">{{ t.l }}<\u002Fcode><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;min-width:0\"><span style=\"{{ t.swD }}\"><\u002Fspan><code style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5C524A\">{{ t.d }}<\u002Fcode><\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.45;color:#5C524A\">{{ t.use }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start\">\n    <sc-for list=\"{{ themeFrames }}\" as=\"f\" hint-placeholder-count=\"2\">\n      <div style=\"display:flex;flex-direction:column;gap:8px;flex:1 1 360px;min-width:0\">\n        <div style=\"font-size:12px;font-weight:800;color:#756A60;letter-spacing:.08em;text-transform:uppercase\">{{ f.label }}<\u002Fdiv>\n        <div style=\"{{ f.vars }}\">\n          <div style=\"background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px\">\n            <div style=\"background:var(--successSoft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;align-items:center;gap:8px;color:var(--success);font-weight:800;font-size:15px\"><span style=\"width:22px;height:22px;border-radius:50%;background:var(--success);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px\">✓<\u002Fspan>Berhasil<\u002Fdiv><div style=\"font-size:14px;line-height:1.45;color:var(--ink)\">Tersimpan, terkirim, disetujui.<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:var(--warningSoft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;align-items:center;gap:8px;color:var(--warning);font-weight:800;font-size:15px\"><span style=\"width:22px;height:22px;border-radius:50%;border:2.5px solid var(--warning);display:flex\"><\u002Fspan>Peringatan<\u002Fdiv><div style=\"font-size:14px;line-height:1.45;color:var(--ink)\">Menunggu, batas waktu dekat.<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:var(--dangerSoft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;align-items:center;gap:8px;color:var(--danger);font-weight:800;font-size:15px\"><span style=\"width:22px;height:22px;border-radius:50%;background:var(--danger);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px\">!<\u002Fspan>Bahaya<\u002Fdiv><div style=\"font-size:14px;line-height:1.45;color:var(--ink)\">Error, ditolak, membuang isian.<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:var(--infoSoft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;align-items:center;gap:8px;color:var(--info);font-weight:800;font-size:15px\"><span style=\"width:22px;height:22px;border-radius:50%;background:var(--info);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px\">i<\u002Fspan>Info<\u002Fdiv><div style=\"font-size:14px;line-height:1.45;color:var(--ink)\">Arahan, perubahan aturan.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 2. HURUF -->\n<section id=\"huruf\" style=\"padding:48px 0;border-top:1px solid #E3D9CC;display:flex;flex-direction:column;gap:24px;scroll-margin-top:16px\">\n  <div style=\"display:flex;flex-direction:column;gap:8px;max-width:760px\">\n    <div style=\"font-size:13px;font-weight:800;color:#17706A;letter-spacing:.06em\">2 · HURUF · TAM-10<\u002Fdiv>\n    <h2 style=\"margin:0;font-size:32px;line-height:1.2;font-weight:800;letter-spacing:-0.01em\">Huruf: Plus Jakarta Sans<\u002Fh2>\n    <p style=\"margin:0;font-size:16px;line-height:1.6;color:#5C524A;text-wrap:pretty\">Huruf buatan desainer Indonesia, bentuknya terbuka dan jelas di layar kecil. Angka selalu memakai lebar sama (<i>tabular<\u002Fi>) supaya kolom rupiah lurus. Isi tidak pernah di bawah 16 px; tulisan paling kecil 13 px, hanya untuk label pendek.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"background:#fff;border:1px solid #E3D9CC;border-radius:16px;overflow:hidden\">\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 110px 110px minmax(0,2.2fr);gap:12px;font-size:12px;font-weight:800;letter-spacing:.06em;color:#756A60;padding:12px 16px;border-bottom:1px solid #E3D9CC;background:#FAF7F2\"><div>PERAN<\u002Fdiv><div>PC<\u002Fdiv><div>HANDPHONE<\u002Fdiv><div>CONTOH<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 110px 110px minmax(0,2.2fr);gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #F0E9DF\"><div style=\"font-weight:700;font-size:15px\">Angka besar<\u002Fdiv><code style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5C524A\">32/40 · 800<\u002Fcode><code style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5C524A\">28/36 · 800<\u002Fcode><div style=\"font-size:32px;line-height:40px;font-weight:800;letter-spacing:-0.01em\">Rp 1.250.000<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 110px 110px minmax(0,2.2fr);gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #F0E9DF\"><div style=\"font-weight:700;font-size:15px\">Judul halaman<\u002Fdiv><code style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5C524A\">28/36 · 800<\u002Fcode><code style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5C524A\">24/32 · 800<\u002Fcode><div style=\"font-size:28px;line-height:36px;font-weight:800;letter-spacing:-0.01em\">Pengajuan Saya<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 110px 110px minmax(0,2.2fr);gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #F0E9DF\"><div style=\"font-weight:700;font-size:15px\">Judul bagian<\u002Fdiv><code style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5C524A\">20/28 · 700<\u002Fcode><code style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5C524A\">20/28 · 700<\u002Fcode><div style=\"font-size:20px;line-height:28px;font-weight:700\">Perlu perhatian saya<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 110px 110px minmax(0,2.2fr);gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #F0E9DF\"><div style=\"font-weight:700;font-size:15px\">Subjudul<\u002Fdiv><code style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5C524A\">17/24 · 700<\u002Fcode><code style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5C524A\">17/24 · 700<\u002Fcode><div style=\"font-size:17px;line-height:24px;font-weight:700\">Kasbon Rp 500.000<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 110px 110px minmax(0,2.2fr);gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #F0E9DF\"><div style=\"font-weight:700;font-size:15px\">Isi<\u002Fdiv><code style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5C524A\">16/24 · 400<\u002Fcode><code style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5C524A\">16/24 · 400<\u002Fcode><div style=\"font-size:16px;line-height:24px\">Pengajuan izin terkirim. Menunggu persetujuan kepala toko.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 110px 110px minmax(0,2.2fr);gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #F0E9DF\"><div style=\"font-weight:700;font-size:15px\">Keterangan<\u002Fdiv><code style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5C524A\">14/20 · 500<\u002Fcode><code style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5C524A\">14/20 · 500<\u002Fcode><div style=\"font-size:14px;line-height:20px;font-weight:500;color:#5C524A\">Diajukan Selasa, 14 Okt 2026, 08.15<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 110px 110px minmax(0,2.2fr);gap:12px;align-items:center;padding:14px 16px\"><div style=\"font-weight:700;font-size:15px\">Label kecil<\u002Fdiv><code style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5C524A\">13/18 · 700<\u002Fcode><code style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5C524A\">13/18 · 700<\u002Fcode><div style=\"font-size:13px;line-height:18px;font-weight:700;color:#5C524A\">LANGKAH 2 DARI 4 · paling kecil yang boleh<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px\">\n    <div style=\"background:#fff;border:1px solid #E3D9CC;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-weight:800;font-size:15px\">Cara menulis rupiah<\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;gap:12px;font-size:16px\"><span style=\"color:#2B7A4B;font-weight:700\">✓ Benar<\u002Fspan><b>Rp 1.250.000<\u002Fb><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;gap:12px;font-size:16px;color:#756A60\"><span style=\"color:#B3332B;font-weight:700\">✕ Salah<\u002Fspan><span style=\"text-decoration:line-through\">Rp1250000 · IDR 1,250,000.00<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:14px;line-height:1.5;color:#5C524A\">\"Rp\", satu spasi, titik setiap ribuan, tanpa \",00\". Saat diketik, titik muncul sendiri.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E3D9CC;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-weight:800;font-size:15px\">Potongan dan tambahan<\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;gap:12px;font-size:16px\"><span>Denda terlambat<\u002Fspan><b style=\"color:#B3332B\">−Rp 20.000<\u002Fb><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;gap:12px;font-size:16px\"><span>Lembur 3 jam<\u002Fspan><b style=\"color:#2B7A4B\">+Rp 75.000<\u002Fb><\u002Fdiv>\n      <div style=\"font-size:14px;line-height:1.5;color:#5C524A\">Tanda − dan + selalu ditulis, bukan hanya warna. Kolom angka rata kanan.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E3D9CC;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-weight:800;font-size:15px\">Tanggal dan jam<\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;gap:12px;font-size:16px\"><span>Tanggal<\u002Fspan><b>Selasa, 14 Okt 2026<\u002Fb><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;gap:12px;font-size:16px\"><span>Jam<\u002Fspan><b>08.15<\u002Fb><\u002Fdiv>\n      <div style=\"font-size:14px;line-height:1.5;color:#5C524A\">Nama hari disebut untuk jadwal dan izin. Jam memakai titik, format 24 jam.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 3. KOMPONEN -->\n<div id=\"komponen\" style=\"padding:48px 0 8px;border-top:1px solid #E3D9CC;display:flex;flex-direction:column;gap:8px;scroll-margin-top:16px\">\n  <div style=\"font-size:13px;font-weight:800;color:#17706A;letter-spacing:.06em\">3 · KOMPONEN BAKU · TAM-06<\u002Fdiv>\n  <h2 style=\"margin:0;font-size:32px;line-height:1.2;font-weight:800;letter-spacing:-0.01em\">Komponen baku<\u002Fh2>\n  <p style=\"margin:0;font-size:16px;line-height:1.6;color:#5C524A;max-width:760px;text-wrap:pretty\">Setiap halaman memakai komponen yang sama. Bingkai PC 640 px, bingkai handphone 360 px (lebar HP paling sempit yang dipakai karyawan).<\u002Fp>\n<\u002Fdiv>\n\n<!-- 3a Tombol -->\n<section style=\"padding:32px 0;display:flex;flex-direction:column;gap:20px\">\n  <div style=\"display:flex;flex-direction:column;gap:6px;max-width:760px\">\n    <div style=\"font-size:13px;font-weight:800;color:#756A60;letter-spacing:.06em\">3A · TAM-13, TAM-14, TAM-19<\u002Fdiv>\n    <h3 style=\"margin:0;font-size:24px;line-height:1.25;font-weight:800\">Tombol dan jalan keluar<\u002Fh3>\n    <p style=\"margin:0;font-size:15px;line-height:1.6;color:#5C524A;text-wrap:pretty\">Tinggi 48 px. Di handphone tombol selebar layar dan bertumpuk. Tombol yang menyimpan atau mengirim terkunci sejak diklik sampai selesai (paling singkat 1 detik), dengan tanda berputar. Tombol yang membuang atau membatalkan selalu bergaris, tidak pernah berwarna penuh seperti tombol utama.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start\">\n    <sc-for list=\"{{ frames }}\" as=\"f\" hint-placeholder-count=\"4\">\n      <div style=\"display:flex;flex-direction:column;gap:8px;max-width:100%\">\n        <div style=\"font-size:12px;font-weight:800;color:#756A60;letter-spacing:.08em;text-transform:uppercase\">{{ f.label }}<\u002Fdiv>\n        <div style=\"{{ f.vars }}\">\n          <div style=\"width:var(--fw);max-width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:var(--pad);display:flex;flex-direction:column;gap:18px\">\n            <div style=\"font-size:13px;font-weight:700;color:var(--ink3);letter-spacing:.04em\">AKSI<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:var(--stack);flex-wrap:wrap;gap:12px\">\n              <button style=\"min-height:48px;padding:12px 20px;border-radius:var(--r);border:0;background:var(--primary);color:var(--onPrimary);font-size:16px;font-weight:700;line-height:1.25;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:var(--btnw);cursor:pointer\" style-hover=\"background:var(--primaryHover)\">Simpan<\u002Fbutton>\n              <button style=\"min-height:48px;padding:12px 20px;border-radius:var(--r);border:1.5px solid var(--primary);background:var(--surface);color:var(--primary);font-size:16px;font-weight:700;line-height:1.25;display:inline-flex;align-items:center;justi ton>\n            <\u002Fdiv>\n            <div style=\"font-size:13px;font-weight:700;color:var(--ink3);letter-spacing:.04em\">NONAKTIF<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:var(--stack);gap:12px\">\n              <button disabled=\"\" style=\"min-height:48px;padding:12px 20px;border-radius:var(--r);border:0;background:var(--surface2);color:var(--ink3);font-size:16px;font-weight:700;width:var(--btnw);cursor:not-allowed\">Kirim<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 3b Error -->\n<section style=\"padding:32px 0;display:flex;flex-direction:column;gap:20px\">\n  <div style=\"display:flex;flex-direction:column;gap:6px;max-width:760px\">\n    <div style=\"font-size:13px;font-weight:800;color:#756A60;letter-spacing:.06em\">3B · TAM-01 S.D. TAM-06<\u002Fdiv>\n    <h3 style=\"margin:0;font-size:24px;line-height:1.25;font-weight:800\">Jendela error<\u002Fh3>\n    <p style=\"margin:0;font-size:15px;line-height:1.6;color:#5C524A;text-wrap:pretty\">Di tengah layar, layar belakang terkunci. Isi: apa yang gagal, kenapa, harus berbuat apa. Tidak tertutup dengan sentuh di luar, Esc, tombol kembali HP, geser, atau waktu. \"OK, paham\" aktif setelah 1 detik (garis isian berjalan). Kode rujukan hanya muncul kalau penyebabnya tidak diketahui.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start\">\n    <sc-for list=\"{{ frames }}\" as=\"f\" hint-placeholder-count=\"4\">\n      <div style=\"display:flex;flex-direction:column;gap:8px;max-width:100%\">\n        <div style=\"font-size:12px;font-weight:800;color:#756A60;letter-spacing:.08em;text-transform:uppercase\">{{ f.label }}<\u002Fdiv>\n        <div style=\"{{ f.vars }}\">\n          <div style=\"width:var(--fw);max-width:100%;height:var(--mh);position:relative;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius ackground:var(--infoSoft);color:var(--info);font-size:13px;font-weight:700;margin-top:10px\">↑ Sedang mengirim 60%<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--successSoft);color:var(--success);font-size:13px;font-weight:700;margin-top:10px\">✓ Terkirim<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--warningSoft);color:var(--warning);font-size:13px;font-weight:700;margin-top:10px\">○ Belum terkirim<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 3h-3 Daftar per halaman -->\n<section style=\"padding:32px 0;display:flex;flex-direction:column;gap:20px\">\n  <div style=\"display:flex;flex-direction:column;gap:6px;max-width:760px\">\n    <div style=\"font-size:13px;font-weight:800;color:#756A60;letter-spacing:.06em\">3H · TAM-12<\u002Fdiv>\n    <h3 style=\"margin:0;font-size:24px;line-height:1.25;font-weight:800\">Daftar per halaman<\u002Fh3>\n    <p style=\"margin:0;font-size:15px;line-height:1.6;color:#5C524A;text-wrap:pretty\">Tidak memakai tabel lebar. Setiap baris adalah kartu yang melipat sendiri di handphone, sehingga tidak ada geser ke samping. 10 baris per halaman; tombol halaman besar dengan kata, bukan hanya panah.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start\">\n    <sc-for list=\"{{ frames }}\" as=\"f\" hint-placeholder-count=\"4\">\n      <div style=\"display:flex;flex-direction:column;gap:8px;max-width:100%\">\n        <div style=\"font-size:12px;font-weight:800;color:#756A60;letter-spacing:.08em;text-transform:uppercase\">{{ f.label }}<\u002Fdiv>\n        <div style=\"{{ f.vars }}\">\n          <div style=\"width:var(--fw);max-width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:var(--pad);display:flex;flex-direction:column;gap:14px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\"><div style=\"font-size:20px;font-weight:800\">Laporan Kasir<\u002Fdiv><div style=\"font-size:14px;color:var(--ink2);font-weight:500\">Oktober 2026 · 48 laporan<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden\">\n              <sc-for list=\"{{ listRows }}\" as=\"row\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:14px 16px;border-bottom:1px solid var(--line);min-height:64px\">\n                  <div style=\"flex:1 1 180px;min-width:0;display:flex;flex-direction:column;gap:2px\"><div style=\"font-size:16px;font-weight:700\">{{ row.title }}<\u002Fdiv><div style=\"font-size:14px;color:var(--ink2)\">{{ row.sub }}<\u002Fdiv><\u002Fdiv>\n                  <div style=\"font-size:16px;font-weight:700;flex:0 0 auto\">{{ row.amt }}<\u002Fdiv>\n                  <span style=\"{{ row.chip }}\">{{ row.status }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:var(--stack);align-items:var(--align);justify-content:space-between;gap:12px\">\n              <div style=\"font-size:15px;font-weight:600;color:var(--ink2);text-align:center\">Halaman 1 dari 12<\u002Fdiv>\n              <div style=\"display:flex;gap:12px\">\n                <button disabled=\"\" style=\"flex:1;min-height:48px;padding:0 16px;border-radius:var(--r);border:1.5px solid var(--line);background:transparent;color:var(--ink3);font-size:15px;font-weight:700;cursor:not-allowed\">‹ Sebelumnya<\u002Fbutton>\n                <button style=\"flex:1;min-height:48px;padding:0 16px;border-radius:var(--r);border:1.5px solid var(--primary);background:transparent;color:var(--primary);font-size:15px;font-weight:700;cursor:pointer\">Berikutnya ›<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 3h-4 Kartu ringkasan + 3i Status -->\n<section style=\"padding:32px 0;display:flex;flex-direction:column;gap:20px\">\n  <div style=\"display:flex;flex-direction:column;gap:6px;max-width:760px\">\n    <div style=\"font-size:13px;font-weight:800;color:#756A60;letter-spacing:.06em\">3H · 3I<\u002Fdiv>\n    <h3 style=\"margin:0;font-size:24px;line-height:1.25;font-weight:800\">Kartu ringkasan dan label status<\u002Fh3>\n    <p style=\"margin:0;font-size:15px;line-height:1.6;color:#5C524A;text-wrap:pretty\">Kartu: satu angka besar, satu keterangan, satu tautan. Label status: warna lembut dengan tanda bentuk dan kata. Tujuh status: Menunggu, Diperiksa (sedang dicek pemeriksa, misalnya finance untuk kasbon), Disetujui, Ditolak, Dibatalkan, Dicabut (persetujuan ditarik dengan alasan), Hangus (lewat batas waktu).<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start\">\n    <sc-for list=\"{{ frames }}\" as=\"f\" hint-placeholder-count=\"4\">\n      <div style=\"display:flex;flex-direction:column;gap:8px;max-width:100%\">\n        <div style=\"font-size:12px;font-weight:800;color:#756A60;letter-spacing:.08em;text-transform:uppercase\">{{ f.label }}<\u002Fdiv>\n        <div style=\"{{ f.vars }}\">\n          <div style=\"width:var(--fw);max-width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:var(--pad);display:flex;flex-direction:column;gap:18px\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px\">\n              <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px\"><div style=\"font-size:14px;font-weight:600;color:var(--ink2)\">Pendapatan Oktober<\u002Fdiv><div style=\"font-size:24px;line-height:32px;font-weight:800\">Rp 4.750.000<\u002Fdiv><div style=\"font-size:13px;color:var(--ink2)\">Sampai 13 Okt 2026<\u002Fdiv><div style=\"font-size:15px;font-weight:700;color:var(--primary);margin-top:4px\">Lihat rincian ›<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px\"><div style=\"font-size:14px;font-weight:600;color:var(--ink2)\">Sisa kasbon<\u002Fdiv><div style=\"font-size:24px;line-height:32px;font-weight:800\">Rp 500.000<\u002Fdiv><div style=\"font-size:13px;color:var(--ink2)\">Lunas Desember 2026<\u002Fdiv><div style=\"font-size:15px;font-weight:700;color:var(--primary);margin-top:4px\">Lihat cicilan ›<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px\"><div style=\"font-size:14px;font-weight:600;color:var(--ink2)\">Kehadiran<\u002Fdiv><div style=\"font-size:24px;line-height:32px;font-weight:800\">11 dari 12 hari<\u002Fdiv><div style=\"font-size:13px;color:var(--warning);font-weight:600\">1 kali terlambat<\u002Fdiv><div style=\"font-size:15px;font-weight:700;color:var(--primary);margin-top:4px\">Lihat jadwal ›<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n              <span style=\"display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--warningSoft);color:var(--warning);font-size:14px;font-weight:700\">○ Menunggu<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--infoSoft);color:var(--info);font-size:14px;font-weight:700\">◐ Diperiksa<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--successSoft);color:var(--success);font-size:14px;font-weight:700\">✓ Disetujui<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--dangerSoft);color:var(--danger);font-size:14px;font-weight:700\">✕ Ditolak<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--surface2);color:var(--ink2);font-size:14px;font-weight:700\">– Dibatalkan<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--dangerSoft);color:var(--danger);border:1.5px dashed var(--danger);font-size:14px;font-weight:700\">↺ Dicabut<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--surface2);color:var(--warning);font-size:14px;font-weight:700\">◌ Hangus<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 3j Kaki -->\n<section style=\"padding:32px 0;display:flex;flex-direction:column;gap:20px\">\n  <div style=\"display:flex;flex-direction:column;gap:6px;max-width:760px\">\n    <div style=\"font-size:13px;font-weight:800;color:#756A60;letter-spacing:.06em\">3J · TAM-11, TAM-20<\u002Fdiv>\n    <h3 style=\"margin:0;font-size:24px;line-height:1.25;font-weight:800\">Kaki halaman dan pilihan mode<\u002Fh3>\n    <p style=\"margin:0;font-size:15px;line-height:1.6;color:#5C524A;text-wrap:pretty\">Nomor versi selalu terlihat; \"Apa yang baru\" membuka changelog di dalam aplikasi. Pilihan mode terang/gelap ada di kaki menu (dan di bilah atas PC).<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start\">\n    <sc-for list=\"{{ frames }}\" as=\"f\" hint-placeholder-count=\"4\">\n      <div style=\"display:flex;flex-direction:column;gap:8px;max-width:100%\">\n        <div style=\"font-size:12px;font-weight:800;color:#756A60;letter-spacing:.08em;text-transform:uppercase\">{{ f.label }}<\u002Fdiv>\n        <div style=\"{{ f.vars }}\">\n          <div style=\"width:var(--fw);max-width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:16px var(--pad);display:flex;flex-direction:var(--stack);align-items:var(--align);justify-content:space-between;gap:14px\">\n            <div style=\"display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;font-size:14px\"><span style=\"font-weight:700;color:var(--ink2)\">v3.0.0<\u002Fspan><span style=\"color:var(--ink3)\">·<\u002Fspan><a href=\"#\" style=\"color:var(--primary);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center\">Apa yang baru<\u002Fa><\u002Fdiv>\n            <div style=\"display:flex;padding:4px;border-radius:999px;background:var(--surface2);gap:4px\">\n              <div style=\"flex:1;min-height:40px;padding:0 16px;border-radius:999px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700\">☀ Terang<\u002Fdiv>\n              <div style=\"flex:1;min-height:40px;padding:0 16px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--ink2)\">☾ Gelap<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"background:#fff;border:1px solid #E3D9CC;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px\">\n    <div style=\"font-weight:800;font-size:15px\">Kamus kata tombol (TAM-19) · satu tindakan, satu kata<\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n      <sc-for list=\"{{ kamus }}\" as=\"k\" hint-placeholder-count=\"12\">\n        <div style=\"display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:#FAF7F2;border:1px solid #EDE5DA;min-width:150px;flex:1 1 150px\"><span style=\"font-weight:800;font-size:15px\">{{ k.w }}<\u002Fspan><span style=\"font-size:13px;color:#5C524A;line-height:1.4\">{{ k.d }}<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 4. COBA LANGSUNG -->\n<section id=\"coba\" style=\"padding:48px 0;border-top:1px solid #E3D9CC;display:flex;flex-direction:column;gap:20px;scroll-margin-top:16px\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;max-width:680px\">\n      <div style=\"font-size:13px;font-weight:800;color:#17706A;letter-spacing:.06em\">4 · COBA LANGSUNG<\u002Fdiv>\n      <h2 style=\"margin:0;font-size:32px;line-height:1.2;font-weight:800;letter-spacing:-0.01em\">Rasakan aturannya<\u002Fh2>\n      <p style=\"margin:0;font-size:16px;line-height:1.6;color:#5C524A;text-wrap:pretty\">Semua di bawah ini bekerja sungguhan: kunci 1 detik, hitungan 3 detik, antrean pengingat, dan langkah yang ingat posisinya walau halaman dimuat ulang.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;padding:4px;border-radius:999px;background:#E3D9CC;gap:4px\">\n      <button sc-camel-on-click=\"{{ setTerang }}\" style=\"{{ segTerang }}\">☀ Terang<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ setGelap }}\" style=\"{{ segGelap }}\">☾ Gelap<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"{{ playVars }}\">\n    <div style=\"background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;transition:background .2s\">\n\n      <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:13px;font-weight:800;color:var(--ink3);letter-spacing:.06em\">TOMBOL MEMPROSES<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.5;color:var(--ink2)\">Coba klik berkali-kali. Tombol terkunci sampai selesai.<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ doSave }}\" disabled=\"{{ saving }}\" style=\"{{ saveBtnStyle }}\"><sc-if value=\"{{ saving }}\" hint-placeholder-val=\"{{ false }}\">{{ spinner }}<span>Menyimpan…<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ notSaving }}\" hint-placeholder-val=\"{{ true }}\"><span>Simpan<\u002Fspan><\u002Fsc-if><\u002Fbutton>\n        <div style=\"font-size:14px;font-weight:600;color:var(--success);min-height:20px\">{{ saveMsg }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:13px;font-weight:800;color:var(--ink3);letter-spacing:.06em\">JENDELA ERROR<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.5;color:var(--ink2)\">Coba tutup dengan klik di luar atau Esc. Tidak bisa.<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ openErr }}\" style=\"min-height:48px;padding:0 20px;border-radius:var(--r);border:1.5px solid var(--primary);background:transparent;color:var(--primary);font-size:16px;font-weight:700;cursor:pointer\">Kirim lembur tanpa tanggal<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:13px;font-weight:800;color:var(--
